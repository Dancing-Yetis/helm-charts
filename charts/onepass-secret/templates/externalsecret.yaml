{{- $ClusterSecretStore := .Values.cluster_secret_store -}}
{{- $namespace := .Values.namespace }}
{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: {{ $namespace }}
  name: {{ .name }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $ClusterSecretStore }}
  target:
    creationPolicy: Owner
  {{- if .data | len }}
  data:
    {{ range .data -}}
    - secretKey: {{ .secretKey }}
      key: {{ .key }}
      property: {{ .property }}
    {{- end }}
  {{- end }}
{{- end }}