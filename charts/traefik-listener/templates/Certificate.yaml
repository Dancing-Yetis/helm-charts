{{- $root := . }}
{{- $namePrefix := "traefik-listener.namePrefix" }}
{{- $hostname := .Values.hostname -}}
{{- $namespace := .Values.namespace -}}
{{- $altNames := .Values.alt_names -}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name:  "{{ include "traefik-listener.namePrefix" $root }}-tls"
  {{- if $namespace }}
  namespace: {{ $namespace }}
  {{- end }}
spec:
  secretName: "{{ include "traefik-listener.namePrefix" $root }}-tls"
  privateKey:
    rotationPolicy: Always
  commonName: {{ $hostname }}
  dnsNames: |
    - {{ $hostname }}
    {{- range $altNames }}
    - {{ . }}
    {{- end }}
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
