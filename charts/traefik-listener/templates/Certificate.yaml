{{- $root := . }}
{{- $service := .Values.service -}}
{{- $domain := .Values.domain -}}
{{- $namespace := .Values.namespace -}}
{{- $altNames := .Values.alt_names -}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name:  "{{ $service }}-tls"
  {{- if $namespace }}
  namespace: {{ $namespace }}
  {{- end }}
spec:
  secretName: "{{ $service }}-tls"
  privateKey:
    rotationPolicy: Always
  commonName: {{ $service }}.{{ $domain }}
  dnsNames: |
    - {{ $service }}.{{ $domain }}
    {{- range $altNames }}
    - {{ . }}
    {{- end }}
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
