{{- $namespace := .Values.namespace -}}
{{- $service := .Values.service -}}
{{- $domain := .Values.domain -}}
{{- $forceRedirect := .Values.force_redirect -}}
{{- $forceCompression := .Values.force_compression -}}
{{- range .Values.entryPoints }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ $service }}-http"
  {{- if $namespace }}
  namespace: {{ $namespace }}
  {{- end }}
spec:
  entryPoints:
    - {{ .name }}
  routes:
    - match: Host(`{{ $service }}.{{ $domain }}`)
      kind: Rule
      {{- if or (.middlewares | list | len) (and $forceRedirect .name "web") (and $forceCompression ne .name "web") }}
      middlewares:
        {{- if and (eq .name "web") ($forceRedirect) }}
        - name: "{{ $service }}-redirect"
        {{- end }}
        {{- if and (ne .name "web") ($forceCompression) }}
        - name: "{{ $service }}-compress"
        {{- end }}
        {{- range .middlewares -}}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      services:
        {{ range .services -}}
        - name: {{ $service }}
          port: {{ .port }}
        {{- end }}
  {{- if .tls }}
  tls:
    secretName: "{{ $service }}-tls"
  {{- end -}}
{{- end -}}