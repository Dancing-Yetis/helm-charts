{{- $root := . }}
{{- $hostname := .Values.hostname -}}
{{- $namespace := .Values.namespace -}}
{{- range .Values.entryPoints }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "traefik-listener.namePrefix" $root }}-http"
  {{- if $namespace -}}
  namespace: {{ $namespace }}
  {{- end }}
spec:
  entryPoints:
    - {{ .name }}
  routes:
    - match: Host(`{{ $hostname }}`)
      kind: Rule
      {{- if .middlewares | len -}}
      middlewares:
        {{ range .middlewares -}}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      services:
        {{ range .services -}}
        - name: {{ .name }}
          port: {{ .port }}
        {{- end }}
  {{- if .tls }}
  tls:
    secretName: "{{ include "traefik-listener.namePrefix" $root }}-tls"
  {{- end -}}
{{- end }}